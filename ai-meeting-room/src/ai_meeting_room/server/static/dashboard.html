<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Meeting Room — Host Dashboard</title>
  <style>
    :root {
      --bg: #0f1117;
      --panel: #171a22;
      --border: #2a3040;
      --text: #e8ecf4;
      --muted: #8b95a8;
      --accent: #5b8cff;
      --good: #3ecf8e;
      --warn: #f0b429;
      --bad: #ff6b6b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
    }
    header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }
    h1 { margin: 0; font-size: 1.25rem; font-weight: 600; }
    .meta { color: var(--muted); font-size: 0.9rem; }
    main {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 1rem;
      padding: 1rem 1.5rem 2rem;
      max-width: 1200px;
      margin: 0 auto;
    }
    @media (max-width: 900px) {
      main { grid-template-columns: 1fr; }
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
    }
    .panel h2 {
      margin: 0 0 0.75rem;
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
    }
    .toolbar {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }
    button, .btn {
      border: 1px solid var(--border);
      background: #1f2430;
      color: var(--text);
      border-radius: 8px;
      padding: 0.45rem 0.75rem;
      font-size: 0.85rem;
      cursor: pointer;
    }
    button:hover { border-color: var(--accent); }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button.danger { border-color: #7a3030; color: #ffb4b4; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .agents {
      display: grid;
      gap: 0.75rem;
    }
    .agent-card {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.85rem;
      display: grid;
      gap: 0.5rem;
    }
    .agent-top {
      display: flex;
      justify-content: space-between;
      align-items: start;
      gap: 0.5rem;
    }
    .agent-name { font-weight: 600; }
    .badges { display: flex; gap: 0.35rem; flex-wrap: wrap; }
    .badge {
      font-size: 0.7rem;
      padding: 0.15rem 0.45rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      color: var(--muted);
    }
    .badge.in { color: var(--good); border-color: #2f6f52; }
    .badge.out { color: var(--bad); border-color: #7a3030; }
    .badge.muted { color: var(--warn); border-color: #7a6020; }
    .badge.chair { color: var(--accent); border-color: #3a5090; }
    .agent-actions { display: flex; gap: 0.4rem; flex-wrap: wrap; }
    .relay-log {
      height: 280px;
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.5rem;
      background: #11141b;
      font-size: 0.82rem;
    }
    .relay-line { margin-bottom: 0.55rem; }
    .relay-line .who { color: var(--accent); font-weight: 600; }
    .relay-line .ts { color: var(--muted); font-size: 0.72rem; margin-left: 0.35rem; }
    .relay-compose {
      display: grid;
      gap: 0.5rem;
      margin-top: 0.75rem;
    }
    textarea {
      width: 100%;
      min-height: 80px;
      resize: vertical;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #11141b;
      color: var(--text);
      padding: 0.65rem;
      font: inherit;
    }
    .status-pill {
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
      font-size: 0.75rem;
      border: 1px solid var(--border);
    }
    .status-pill.live { color: var(--good); border-color: #2f6f52; }
    .status-pill.paused { color: var(--warn); border-color: #7a6020; }
    #toast {
      position: fixed;
      right: 1rem;
      bottom: 1rem;
      background: #1f2430;
      border: 1px solid var(--border);
      padding: 0.65rem 0.9rem;
      border-radius: 8px;
      display: none;
      max-width: 320px;
    }
    .join-card {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.85rem;
      display: grid;
      gap: 0.55rem;
      margin-bottom: 0.75rem;
    }
    .join-card:last-child { margin-bottom: 0; }
    .join-url {
      font-size: 0.75rem;
      word-break: break-all;
      color: var(--muted);
    }
    a.join-link {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }
    a.join-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>AI Meeting Room</h1>
      <div class="meta" id="room-meta">Loading…</div>
    </div>
    <div class="toolbar">
      <span id="room-state" class="status-pill">…</span>
      <button id="btn-pause">Pause room</button>
      <button id="btn-resume" style="display:none">Resume room</button>
      <button onclick="refresh()">Refresh</button>
    </div>
  </header>

  <main>
    <section class="panel">
      <h2>Join the room</h2>
      <p class="meta" id="join-help">Loading join links…</p>
      <div id="join-links"></div>
    </section>

    <section class="panel">
      <h2>Participants</h2>
      <div id="agents" class="agents"></div>
    </section>

    <section class="panel">
      <h2>Cursor inbox <span id="cursor-count" class="badge"></span></h2>
      <div id="cursor-inbox" class="relay-log" style="height:140px;margin-bottom:0.75rem"></div>
      <p class="meta">Say “Relay, …” or “Cursor, …” in the room. Pending messages wake the Cursor agent automatically.</p>
    </section>

    <section class="panel">
      <h2>Relay ↔ room</h2>
      <div id="relay-log" class="relay-log"></div>
      <div class="relay-compose">
        <textarea id="relay-input" placeholder="Type a message for Relay to speak in the room…"></textarea>
        <div class="toolbar">
          <button class="primary" id="btn-relay-send">Send &amp; speak</button>
          <button id="btn-relay-log">Log only</button>
        </div>
      </div>
    </section>
  </main>

  <div id="toast"></div>

  <script>
    const toastEl = document.getElementById('toast');
    let state = null;
    let busy = false;

    function toast(msg) {
      toastEl.textContent = msg;
      toastEl.style.display = 'block';
      setTimeout(() => { toastEl.style.display = 'none'; }, 2600);
    }

    async function api(path, options = {}) {
      const res = await fetch(path, {
        headers: { 'Content-Type': 'application/json', ...(options.headers || {}) },
        ...options,
      });
      if (!res.ok) {
        let detail = await res.text();
        try {
          const parsed = JSON.parse(detail);
          detail = parsed.detail || detail;
        } catch (_) {}
        throw new Error(detail || res.statusText);
      }
      const ct = res.headers.get('content-type') || '';
      return ct.includes('application/json') ? res.json() : res.text();
    }

    async function doAction(method, path, body) {
      if (busy) return;
      busy = true;
      try {
        const result = await api(path, {
          method,
          body: body ? JSON.stringify(body) : undefined,
        });
        if (result?.message) toast(result.message);
        await refresh();
        return result;
      } catch (err) {
        toast(String(err.message || err));
        throw err;
      } finally {
        busy = false;
      }
    }

    function badge(text, cls) {
      return `<span class="badge ${cls || ''}">${text}</span>`;
    }

    function renderJoinLinks(data) {
      const root = document.getElementById('join-links');
      const help = document.getElementById('join-help');
      help.textContent = data.instructions || 'Use these links to join with mic access.';
      root.innerHTML = (data.links || []).map(link => `
        <article class="join-card">
          <div class="agent-top">
            <div class="agent-name">${escapeHtml(link.name)}</div>
            <div class="badges">${badge(link.identity, '')}</div>
          </div>
          <div>
            <a class="join-link" href="${escapeHtml(link.join_url)}" target="_blank" rel="noopener">Open in LiveKit Meet →</a>
          </div>
          <div class="join-url">${escapeHtml(link.join_url)}</div>
          <button type="button" data-copy="${escapeHtml(link.join_url)}">Copy link</button>
        </article>
      `).join('');
    }

    document.getElementById('join-links').addEventListener('click', async (event) => {
      const btn = event.target.closest('button[data-copy]');
      if (!btn) return;
      try {
        await navigator.clipboard.writeText(btn.dataset.copy);
        toast('Join link copied');
      } catch (_) {
        toast('Could not copy — select the URL manually');
      }
    });

    function renderAgents(roster) {
      const root = document.getElementById('agents');
      root.innerHTML = roster.map(agent => {
        const badges = [];
        if (agent.in_call) badges.push(badge('in call', 'in'));
        else badges.push(badge('out', 'out'));
        if (agent.muted) badges.push(badge('muted', 'muted'));
        if (agent.is_chair) badges.push(badge('chair', 'chair'));
        if (agent.is_relay) badges.push(badge('relay', 'chair'));

        const actions = [];
        if (agent.in_call) {
          actions.push(
            `<button type="button" data-action="mute" data-key="${agent.key}" data-muted="${agent.muted}">${agent.muted ? 'Unmute' : 'Mute'}</button>`
          );
          if (!agent.is_chair) {
            actions.push(`<button type="button" data-action="chair" data-key="${agent.key}">Make chair</button>`);
          }
          actions.push(`<button type="button" class="danger" data-action="kick" data-key="${agent.key}">Kick</button>`);
        } else {
          actions.push(`<button type="button" class="primary" data-action="invite" data-key="${agent.key}">Invite</button>`);
        }

        return `
          <article class="agent-card">
            <div class="agent-top">
              <div class="agent-name">${agent.name}</div>
              <div class="badges">${badges.join('')}</div>
            </div>
            <div class="meta">${agent.key}</div>
            <div class="agent-actions">${actions.join('')}</div>
          </article>`;
      }).join('');
    }

    function renderCursorInbox(pending) {
      const root = document.getElementById('cursor-inbox');
      const count = document.getElementById('cursor-count');
      count.textContent = pending.length ? `${pending.length} pending` : 'idle';
      if (!pending.length) {
        root.innerHTML = '<div class="meta">No messages waiting for Cursor.</div>';
        return;
      }
      root.innerHTML = pending.map(m => `
        <div class="relay-line">
          <span class="who">${escapeHtml(m.speaker)}</span>
          <span class="ts">${m.ts}</span>
          <div>${escapeHtml(m.text)}</div>
        </div>
      `).join('');
      root.scrollTop = root.scrollHeight;
    }

    function renderRelay(messages) {
      const root = document.getElementById('relay-log');
      if (!messages.length) {
        root.innerHTML = '<div class="meta">No relay messages yet. Speech in the room and Cursor notes appear here.</div>';
        return;
      }
      root.innerHTML = messages.map(m => `
        <div class="relay-line">
          <span class="who">${m.speaker}</span>
          <span class="ts">${m.ts}</span>
          <div>${escapeHtml(m.text)}</div>
        </div>
      `).join('');
      root.scrollTop = root.scrollHeight;
    }

    function escapeHtml(s) {
      return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    document.getElementById('agents').addEventListener('click', async (event) => {
      const btn = event.target.closest('button[data-action]');
      if (!btn) return;
      event.preventDefault();
      const kind = btn.dataset.action;
      const key = btn.dataset.key;
      if (kind === 'mute') {
        const muted = btn.dataset.muted === 'true';
        await doAction('POST', muted ? `/unmute/${key}` : `/mute/${key}`);
      } else if (kind === 'kick') {
        await doAction('POST', `/kick/${key}`);
      } else if (kind === 'invite') {
        await doAction('POST', `/invite/${key}`);
      } else if (kind === 'chair') {
        await doAction('POST', `/chair/${key}`);
      }
    });

    async function refresh() {
      if (busy) return;
      const [status, relay, cursor, joins] = await Promise.all([
        api('/status'),
        api('/relay/messages?limit=80'),
        api('/relay/cursor/pending'),
        api('/join-links'),
      ]);
      state = status;
      document.getElementById('room-meta').textContent =
        `Room: ${status.room} · Chair: ${status.chair_name}`;
      const pill = document.getElementById('room-state');
      pill.textContent = status.paused ? 'Paused' : 'Live';
      pill.className = 'status-pill ' + (status.paused ? 'paused' : 'live');
      document.getElementById('btn-pause').style.display = status.paused ? 'none' : 'inline-block';
      document.getElementById('btn-resume').style.display = status.paused ? 'inline-block' : 'none';
      renderJoinLinks(joins);
      renderAgents(status.roster || []);
      renderCursorInbox(cursor.pending || []);
      renderRelay(relay.messages || []);
    }

    document.getElementById('btn-pause').onclick = () => doAction('POST', '/pause');
    document.getElementById('btn-resume').onclick = () => doAction('POST', '/resume');
    document.getElementById('btn-relay-send').onclick = async () => {
      const text = document.getElementById('relay-input').value.trim();
      if (!text) return;
      await doAction('POST', '/relay/say', { text, speak: true });
      document.getElementById('relay-input').value = '';
    };
    document.getElementById('btn-relay-log').onclick = async () => {
      const text = document.getElementById('relay-input').value.trim();
      if (!text) return;
      await doAction('POST', '/relay/say', { text, speak: false });
      document.getElementById('relay-input').value = '';
    };

    refresh();
    setInterval(refresh, 2500);
  </script>
</body>
</html>
