[project]
name = "ai-meeting-room"
version = "0.1.0"
description = "POC: multi-agent AI meeting room with LiveKit + ElevenLabs"
requires-python = ">=3.10"
dependencies = [
  "livekit-agents>=1.7.0",
  "livekit-api>=1.0.0",
  "livekit>=1.0.0",
  "elevenlabs>=2.0.0",
  "aiohttp>=3.9.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "httpx>=0.27.0",
  "pydantic>=2.0.0",
  "pydantic-settings>=2.0.0",
  "python-dotenv>=1.0.0",
  "openai>=1.0.0",
]

[project.scripts]
ai-meeting-room = "ai_meeting_room.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
